                @if (
                    loginForm.passwordConfirm().touched() && loginForm.passwordConfirm().invalid()
                ) {
                    @for (err of loginForm.passwordConfirm().errors(); track err.kind) {
                        <span class="error">{{ err.message }}</span>
                    }
                }
            </label>
            <label class="check">
                <input type="checkbox" [formField]="loginForm.privacyAccepted" />
                I accept the <a routerLink="/privacy-policy">Privacy policy</a>.
            </label>
        }

        @if (error()) {
            <p class="error">{{ error() }}</p>
        }

        <div class="actions" [class.single]="signupMode()">
            <button type="submit" [disabled]="loading() || loginForm().invalid()">
                {{ loading() ? 'Bitte warten …' : signupMode() ? 'Sign up' : 'Log in' }}
            </button>
            @if (!signupMode()) {
                <button type="button" class="guest" (click)="guestLogin()" [disabled]="loading()">
                    Guest Log in
                </button>
            }
        </div>
    </form>
