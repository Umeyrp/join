<main class="login-page">
    <a class="logo" routerLink="/login"><img src="/app-icons/join_dark.svg" alt="Join" /></a>
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
        <h1>{{ signupMode() ? 'Registrierung' : 'Anmelden' }}</h1>

        @if (signupMode()) {
            <label>
                Name
                <input type="text" formControlName="name" autocomplete="name" />
            </label>
        }
        <label>
            E-Mail
            <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <label>
            Passwort
            <input type="password" formControlName="password" autocomplete="current-password" />
        </label>
        @if (signupMode()) {
            <label>
                Passwort bestätigen
                <input
                    type="password"
                    formControlName="passwordConfirm"
                    autocomplete="new-password"
                />
            </label>
            <label class="check">
                <input type="checkbox" formControlName="privacyAccepted" />
                Ich akzeptiere die <a routerLink="/privacy-policy">Datenschutzerklärung</a>.
            </label>
        }

        @if (error()) {
            <p class="error">{{ error() }}</p>
        }
        <button type="submit" [disabled]="loading()">
            {{ loading() ? 'Bitte warten …' : signupMode() ? 'Registrieren' : 'Anmelden' }}
        </button>
        <button type="button" class="link" (click)="toggleMode()">
            {{ signupMode() ? 'Anmelden' : 'Registrieren' }}
        </button>
    </form>
</main>
