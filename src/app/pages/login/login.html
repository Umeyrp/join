<main class="login-page">
    <app-intro />
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
        <h1>{{ signupMode() ? 'Sign up' : 'Log in' }}</h1>

        @if (signupMode()) {
            <label>
                Name
                <input type="text" formControlName="name" autocomplete="name" />
            </label>
        }
        <label>
            Email
            <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <label>
            Password
            <input type="password" formControlName="password" autocomplete="current-password" />
        </label>
        @if (signupMode()) {
            <label>
                Confirm Password
                <input
                    type="password"
                    formControlName="passwordConfirm"
                    autocomplete="new-password"
                />
            </label>
            <label class="check">
                <input type="checkbox" formControlName="privacyAccepted" />
                I accept the <a routerLink="/privacy-policy">Privacy policy</a>.
            </label>
        }

        @if (error()) {
            <p class="error">{{ error() }}</p>
        }
        <div class="actions" [class.single]="signupMode()">
            <button type="submit" [disabled]="loading()">
                {{ loading() ? 'Bitte warten …' : signupMode() ? 'Sign up' : 'Log in' }}
            </button>
            @if (!signupMode()) {
                <button type="button" class="guest" (click)="guestLogin()" [disabled]="loading()">
                    Guest Log in
                </button>
            }
        </div>
        <button type="button" class="link" (click)="toggleMode()">
            {{ signupMode() ? 'Log in' : 'Sign up' }}
        </button>
    </form>
</main>
