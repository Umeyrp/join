<article class="task-card">
    <span class="task-card__category" [class]="categoryClass()">
        {{ task().category }}
    </span>

    <h3 class="task-card__title">{{ task().title }}</h3>

    @if (task().description) {
        <p class="task-card__description">{{ task().description }}</p>
    }

    @if (subtaskProgress(); as progress) {
        <div class="task-card__subtasks">
            <div class="task-card__progress">
                <div
                    class="task-card__progress-fill"
                    [style.width.%]="progress.percent"
                    [style.background-color]="progress.color"
                ></div>
            </div>
            <span class="task-card__subtasks-count"
                >{{ progress.done }}/{{ progress.total }} Subtasks</span
            >
        </div>
    }
</article>
