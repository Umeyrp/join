@if (contact(); as contact) {
  <div class="contact-card">
    <div class="contact-card__header">
      <div class="contact-card__avatar" [style.background-color]="getAvatarColor(contact.id)">
        {{ getInitials(contact.name) }}
      </div>
      <div class="contact-card__heading">
        <h2 class="contact-card__name">{{ contact.name }}</h2>
        <div class="contact-card__actions">
          <button type="button" class="contact-card__action">
            <img src="icons/edit.svg" alt="" />
            Edit
          </button>
          <button type="button" class="contact-card__action">
            <img src="icons/delete.svg" alt="" />
            Delete
          </button>
        </div>
      </div>
    </div>

    <h3 class="contact-card__section-title">Contact Information</h3>

    <div class="contact-card__field">
      <span class="contact-card__label">Email</span>
      <a class="contact-card__value contact-card__value--link" [href]="'mailto:' + contact.email">{{
        contact.email
      }}</a>
    </div>

    <div class="contact-card__field">
      <span class="contact-card__label">Phone</span>
      <a class="contact-card__value contact-card__value--tel" [href]="telLink(contact.phone)">{{
        contact.phone | phoneFormat
      }}</a>
    </div>
  </div>
}
